[pytest]
testpaths = tests
strict_markers = true
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
markers =
    unit: Unit tests
    integration: Integration tests
    voice: Voice-related tests
    api: API tests
    elevenlabs: ElevenLabs-specific tests
    regression: Regression tests
    slow: Slow tests that may take longer to run
    audio_output: Tests that produce actual audio output
    manual: Tests that require manual verification
    interactive: Tests that accept user input
    openai: OpenAI-specific tests
    pyttsx3: pyttsx3-specific tests
    fallback: Provider fallback tests
    provider: Provider selection and script tests
    quick: Quick smoke tests
    voice_test: Voice tests that produce sound
